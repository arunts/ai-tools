<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Session Analyzer — Report</title>
<style>
  :root,[data-theme="dark"]{
    /* gruvbox dark */
    --bg:#282828; --bg2:#1d2021; --panel:#32302f; --panel2:#3c3836; --line:#504945;
    --ink:#ebdbb2; --muted:#a89984; --faint:#928374;
    --accent:#fabd2f; --accent2:#8ec07c; --accent2b:#689d6a; --warn:#fe8019; --bad:#fb4934;
    --rangeb:#665c54; --heat:250,189,47;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --r:14px; --r2:10px;
  }
  [data-theme="light"]{
    /* gruvbox light */
    --bg:#f2e5bc; --bg2:#ebdbb2; --panel:#fbf1c7; --panel2:#ebdbb2; --line:#d5c4a1;
    --ink:#3c3836; --muted:#665c54; --faint:#7c6f64;
    --accent:#b57614; --accent2:#427b58; --accent2b:#79740e; --warn:#af3a03; --bad:#9d0006;
    --rangeb:#bdae93; --heat:181,118,20;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px}
  a{color:var(--accent);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  h2{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 14px}
  h2::before{content:"› ";color:var(--faint)}
  .sub{color:var(--muted);font-size:13px}
  section{margin-top:38px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .grid{display:grid;gap:14px}

  /* header */
  header .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px}
  header h1{font-size:24px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px}
  .pill b{color:var(--ink);font-weight:600}

  /* hero */
  .hero{background:linear-gradient(135deg,var(--panel2),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:30px;margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px}
  .xbig{font-family:var(--mono);font-size:72px;font-weight:760;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--warn));-webkit-background-clip:text;background-clip:text;color:transparent}
  .xcap{color:var(--muted);font-size:14px;margin-top:8px}
  .hero .saved{font-size:18px;margin-top:18px;color:var(--ink)}
  .hero .saved b{color:var(--accent2)}
  .rangebar{height:8px;border-radius:8px;background:var(--panel2);position:relative;margin:10px 0 4px;overflow:hidden}
  .rangebar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--rangeb),var(--accent));opacity:.7}
  .rngrow{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
  .src{display:inline-block;margin-top:14px;font-size:12px;color:var(--faint);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
  .narrative{color:var(--ink);font-size:14.5px;line-height:1.6}
  .profile{color:var(--accent2);font-weight:600;margin-bottom:8px}

  /* stat cards */
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
  .card .n{font-family:var(--mono);font-size:25px;font-weight:680;letter-spacing:-.02em;color:var(--ink)}
  .card .l{color:var(--muted);font-size:12.5px;margin-top:3px}
  .card .s{color:var(--faint);font-size:11.5px;margin-top:6px}

  /* bars */
  .bar{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .lab{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{background:var(--panel2);border-radius:6px;height:18px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--warn));border-radius:6px}
  .bar .val{font-family:var(--mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar.alt .fill{background:linear-gradient(90deg,var(--accent2),var(--accent2b))}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  td{font-family:var(--mono);font-size:12.5px}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr.detail td{border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;text-align:left;background:var(--panel2)}
  .mult{color:var(--accent2);font-weight:600}
  .clk{cursor:pointer}
  .clk:hover td:first-child{color:var(--accent)}

  /* heatmap */
  .heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;font-size:10px;color:var(--faint)}
  .heat .cell{aspect-ratio:1;border-radius:3px;background:var(--panel2)}
  .heat .hr{text-align:center}
  .heat .dy{display:flex;align-items:center}

  .two{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.hero,.two{grid-template-columns:1fr}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--faint);font-size:12px;margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .foot{margin-top:48px;color:var(--faint);font-size:12px;text-align:center}
  .empty{color:var(--faint);font-size:13px;font-style:italic}
  /* theme toggle + theme-reactive chart colors */
  #themebtn{position:fixed;top:16px;right:16px;z-index:20;width:38px;height:38px;border-radius:999px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-family:var(--mono);font-size:15px;cursor:pointer;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.18);transition:background .2s,color .2s,border-color .2s}
  #themebtn:hover{border-color:var(--accent);color:var(--accent)}
  .tl-line{fill:none;stroke:var(--accent);stroke-width:2}
  .tl-area{fill:rgba(var(--heat),.13);stroke:none}
  .tl-dot{fill:var(--accent)}
  .tr-line{fill:none;stroke:var(--accent2);stroke-width:2}
  .tr-dot{fill:var(--accent2)}
</style>

  ));

  // ---------- tool usage ----------
  const tools = Object.entries(hero.tools||{}).sort((a,b)=>b[1]-a[1]);
  const maxTool = tools.length?tools[0][1]:1;
  const bc = hero.bashClasses||{};
  section("Tool usage", h("div",{class:"grid two"},
    h("div",{class:"panel"},
      h("h2",null,"Most-used tools"),
      tools.length? tools.slice(0,12).map(([name,n])=>bar(name,n,maxTool)) : empty("no tools")
    ),
    h("div",{class:"panel"},
      h("h2",null,"Shell command mix"),
      ["test","build","git","install","other"].map(k=>bar(k,bc[k]||0,Math.max(1,...Object.values(bc)),true)),
      h("div",{class:"legend"},
        h("span",null,h("span",{class:"dot",style:"background:var(--accent)"}),"reads "+intf(hero.reads)),
        h("span",null,h("span",{class:"dot",style:"background:var(--accent2)"}),"writes "+intf(hero.writes)),
        h("span",null,h("span",{class:"dot",style:"background:var(--warn)"}),"edits "+intf(hero.edits))
      )
    )
  ));

  // ---------- activity patterns ----------
  section("Activity patterns", h("div",{class:"grid"},
    h("div",{class:"panel"}, h("h2",null,"When you work (day × hour)"), heatmap(hero.heat||{})),
    h("div",{class:"panel"}, h("h2",null,"Active hours over time"), timelineChart(R.timeline||[]))
  ));

  // ---------- per-project comparison ----------
  const projs = R.projects||[];
  if(projs.length){
    section("Per-project comparison", h("div",{class:"panel"}, projectTable(projs)));
  }

  // ---------- granularity breakdown ----------
  if((meta.granularity==="project"||meta.granularity==="session") && (R.units||[]).length){
    section("Breakdown — "+meta.granularity, h("div",{class:"panel"}, unitTable(R.units)));
  }

  // ---------- methodology ----------
  section("How “time saved” is estimated", h("div",{class:"panel"},
    h("div",{class:"sub"},"Each action is given a manual-time baseline, then Claude calibrates per unit (low / expected / high). Baselines used:"),
    h("div",{class:"grid two",style:"margin-top:14px"},
      h("div",null, methodList()),
      h("div",null, breakdownBars(hero.baseline))
    )
  ));

  // ---------- trends ----------
  if((R.trends||[]).length>1){
    section("Trends across snapshots", h("div",{class:"panel"}, trendChart(R.trends)));
  }

  app.append(h("div",{class:"foot"},"Generated locally by AI Session Analyzer · data: "+(meta.dataDir||"")+" · no data left your machine"));

  // ---------- builders ----------
  function section(title, body){ app.append(h("section",null,h("h2",null,title), body)); }
  function empty(t){ return h("div",{class:"empty"},t); }
  function bar(lab,val,max,alt){
    return h("div",{class:"bar"+(alt?" alt":"")},
      h("div",{class:"lab",title:lab},lab),
      h("div",{class:"track"}, h("div",{class:"fill",style:`width:${Math.max(2,100*val/max)}%`})),
      h("div",{class:"val"},intf(val)));
  }
  function heatmap(heat){
    const max=Math.max(1,...Object.values(heat));
    const D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const grid=h("div",{class:"heat"});
    grid.append(h("div",null,""));
    for(let hr=0;hr<24;hr++) grid.append(h("div",{class:"hr"}, hr%6===0?(""+hr):""));
    for(let d=0;d<7;d++){
      grid.append(h("div",{class:"dy"},D[d]));
      for(let hr=0;hr<24;hr++){
        const v=heat[d+"_"+hr]||0; const a=v? (0.15+0.85*v/max):0;
        grid.append(h("div",{class:"cell",title:D[d]+" "+hr+":00 — "+v+" msgs",style:v?`background:rgba(var(--heat),${a})`:""}));
      }
    }
    return Object.keys(heat).length?grid:empty("no activity recorded");
  }
  function timelineChart(tl){
    if(!tl.length) return empty("no timeline");
    const W=560,H=140,P=24; const max=Math.max(...tl.map(d=>d.activeHours),0.1);
    const x=i=>P+(tl.length===1?W/2:(i*(W-2*P)/(tl.length-1)));
    const y=v=>H-P-(v/max)*(H-2*P);
    const pts=tl.map((d,i)=>x(i)+","+y(d.activeHours));
    const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%"});
    svg.append(svgEl("polyline",{points:pts.join(" "),class:"tl-line"}));
    svg.append(svgEl("polygon",{points:`${P},${H-P} `+pts.join(" ")+` ${x(tl.length-1)},${H-P}`,class:"tl-area"}));
    tl.forEach((d,i)=>svg.append(svgEl("circle",{cx:x(i),cy:y(d.activeHours),r:"2.5",class:"tl-dot"})));
    const wrap=h("div",null,svg,h("div",{class:"rngrow"},h("span",null,tl[0].date),h("span",null,"max "+max.toFixed(1)+"h"),h("span",null,tl[tl.length-1].date)));
    return wrap;
  }
  function trendChart(tr){
    const W=560,H=150,P=26; const max=Math.max(...tr.map(d=>d.activeHours),0.1);
    const x=i=>P+(tr.length===1?W/2:(i*(W-2*P)/(tr.length-1)));
    const y=v=>H-P-(v/max)*(H-2*P);
    const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%"});
    svg.append(svgEl("polyline",{points:tr.map((d,i)=>x(i)+","+y(d.activeHours)).join(" "),class:"tr-line"}));
    tr.forEach((d,i)=>svg.append(svgEl("circle",{cx:x(i),cy:y(d.activeHours),r:"3",class:"tr-dot"})));
    return h("div",null,svg,h("div",{class:"sub"},tr.length+" snapshots · active hours over time"));
  }
  function projectTable(projs){
    const t=h("table",null,h("thead",null,h("tr",null,
      h("th",null,"Project"),h("th",null,"Sessions"),h("th",null,"Active"),h("th",null,"Changes"),h("th",null,"Tokens"),h("th",null,"Saved"),h("th",null,"×"))));
    const tb=h("tbody");
    for(const p of projs){
      const sv=p.timeSaved||{};
      tb.append(h("tr",null,
        h("td",null,p.label),h("td",null,intf(p.sessionsCount)),h("td",null,(p.activeHours||0).toFixed(1)+"h"),
        h("td",null,intf(p.edits+p.writes)),h("td",null,toks((p.tokens?p.tokens.input+p.tokens.output:0))),
        h("td",null, sv.savedMin? hrs(sv.savedMin.expected):"—"),
        h("td",{class:"mult"}, sv.multiplier!=null? sv.multiplier+"×":"—")));
    }
    t.append(tb); return t;
  }
  function unitTable(units){
    const t=h("table",null,h("thead",null,h("tr",null,
      h("th",null,"Unit"),h("th",null,"Sessions"),h("th",null,"Active"),h("th",null,"Changes"),h("th",null,"Saved"),h("th",null,"×"))));
    const tb=h("tbody");
    for(const u of units){
      const sv=u.timeSaved||{};
      const row=h("tr",{class:u.narrative?"clk":""},
        h("td",null,u.label),h("td",null,intf(u.sessionsCount)),h("td",null,(u.activeHours||0).toFixed(1)+"h"),
        h("td",null,intf(u.edits+u.writes)),
        h("td",null, sv.savedMin? hrs(sv.savedMin.expected):"—"),
        h("td",{class:"mult"}, sv.multiplier!=null? sv.multiplier+"×":"—"));
      tb.append(row);
      if(u.narrative){
        const det=h("tr",{class:"detail",style:"display:none"},h("td",{colspan:"6"}, (u.profile?("["+u.profile+"] "):"")+u.narrative));
        row.addEventListener("click",()=>{det.style.display=det.style.display==="none"?"table-row":"none";});
        tb.append(det);
      }
    }
    t.append(tb); return t;
  }
  function methodList(){
    const b=R.baseline||{};
    const rows=[
      ["New file (Write)", b.perWriteMin+" min + "+b.perWriteLine10+" min / 10 lines"],
      ["Edit existing", b.perEditMin+" min + "+b.perEditLine10+" min / 10 lines"],
      ["Bash test/build/git/install", (b.bash?[b.bash.test,b.bash.build,b.bash.git,b.bash.install].join(" / "):"")+" min"],
      ["Bash other", (b.bash?b.bash.other:"")+" min"],
      ["Read/navigate", b.perReadMin+" min (cap "+b.readCapMin+")"],
      ["Overhead", Math.round((b.overheadPct||0)*100)+"%"],
    ];
    return h("div",null,rows.map(([k,v])=>h("div",{class:"bar"},h("div",{class:"lab",style:"width:auto"},k),h("div",{class:"val",style:"text-align:left;color:var(--muted)"},v))));
  }
  function breakdownBars(bl){
    if(!bl||!bl.breakdown) return empty("no baseline");
    const e=bl.breakdown; const items=[["write",e.write],["edit",e.edit],["bash",e.bash],["read",e.read],["overhead",e.overhead]];
    const max=Math.max(1,...items.map(i=>i[1]));
    return h("div",null,h("div",{class:"sub",style:"margin-bottom:8px"},"Estimated manual minutes (this view): "+intf(bl.minutes)),
      items.map(([k,v])=>bar(k,v,max,true)));
  }
  function svgEl(tag,props){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const[k,v]of Object.entries(props))e.setAttribute(k,v);return e;}
})();
</script>
</body>
</html>
